[package]
name = "zlib-ng"
version = "2.3.90"
edition = "2024"
rust-version = "1.88"
license = "Zlib"
description = "zlib data compression library for the next generation systems"
repository = "https://github.com/nmoinvaz/zlib-ng-rs"
publish = false

[lib]
crate-type = ["staticlib"]
# The tests are the C and C++ sources in the test directory.
test = false
doctest = false

[features]
# Export the zlib compatible API instead of the zlib-ng native API.
zlib-compat = []
# Build without the deflate_quick strategy.
no-quick-strategy = []
# Deflate with DFLTCC on IBM Z.
s390-dfltcc-deflate = []
# Reject distances beyond the window size of the zlib header, INFLATE_STRICT in the C sources.
inflate-strict = []
# Fill with zeros for distances that are too far back when inflateUndermine asks for it.
inflate-allow-invalid-dist = []
# z_off_t is 32 bits wide.
z-off-t-32 = []
# z_off64_t is 32 bits wide.
z-off64-t-32 = []
# Pick the optimized functions at run time through the function table.
runtime-cpu-detection = []
# Keep distances and literals/lengths in separate buffers, LIT_MEM in the C sources.
lit-mem = []
# Check the structures shared with the C sources against the layout that the build read from them.
c-layout = []

# Unwinding into C callers is undefined behavior.
[profile.dev]
panic = "abort"
codegen-units = 1

[profile.release]
panic = "abort"
codegen-units = 1
